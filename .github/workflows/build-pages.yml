# index.html のバンドデータを変更して push すると、
# バンドページ・国ページ・一覧・sitemap.xml を自動で作り直してコミットします。
name: バンドページ自動生成

on:
  push:
    branches: [main]
    paths: [index.html, tools/build-pages.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-pages.mjs
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A band country bands sitemap.xml
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "バンドページを自動生成"
            git push
          fi
